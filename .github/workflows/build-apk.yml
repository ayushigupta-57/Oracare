name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --org com.oracare --project-name oracare_daily --platforms android .
          rm -f test/widget_test.dart
      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="Oracare"/' android/app/src/main/AndroidManifest.xml
      - name: Bundle Roboto from the Flutter SDK
        run: |
          F="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts"
          ls "$F" || true
          if [ -f "$F/Roboto-Regular.ttf" ]; then
            mkdir -p assets/fonts
            cp "$F"/Roboto-Light.ttf "$F"/Roboto-Regular.ttf "$F"/Roboto-Medium.ttf "$F"/Roboto-Bold.ttf assets/fonts/
            cat >> pubspec.yaml <<'EOF'
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
EOF
          fi
      - run: flutter pub get
      - name: App icon from assets/images/logo.png (if present)
        run: |
          if [ -f assets/images/logo.png ]; then
            flutter pub add --dev "flutter_launcher_icons:^0.14.3"
            dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: oracare-daily-apk
          path: build/app/outputs/flutter-apk/app-release.apk
